# Refreshes the Virtuoso-sourced atlas data every night and commits the result.
# (Every other night until 7 October 2026 — see the throttle above `jobs:`.)
#
# The data is committed rather than fetched at request time so that every change
# lands as a reviewable diff: these files carry a lot of hand-curation, and a
# supplier quietly dropping records is invisible without one. Vercel deploys from
# the resulting commit as usual.
#
# Requires four repository secrets: VIRTUOSO_API_USER, VIRTUOSO_API_KEY,
# VIRTUOSO_API_AES_KEY, VIRTUOSO_API_AES_IV.
name: Virtuoso data sync

on:
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC — 03:00 Aspen (MDT), well clear of the working day
  workflow_dispatch:          # and on demand, from the Actions tab

concurrency:
  group: virtuoso-sync        # never let two syncs race for the same commit
  cancel-in-progress: false

# Until 7 October 2026 the sync runs every OTHER night rather than nightly.
#
# Every sync commits, and Vercel builds production from that commit — just under
# five minutes a night for this project — and the team is close to its build
# allowance. Halving the syncs halves those builds, at the cost of data that can
# be up to 48 hours old rather than 24.
#
# It is a gate on a nightly trigger rather than a fortnightly cron, for two
# reasons. `*/2` in the day-of-month field is not "every other day": it restarts
# at the 1st, so a 31-day month puts two runs on consecutive nights. And a cron
# edited by hand has to be edited back by hand, which is the kind of thing that
# is still throttled at Christmas. This one expires on its own — from 8 October
# the gate stops throttling and the nightly cron is nightly again, with no second
# commit needed.
#
# Freshness is untouched by it: verify-virtuoso-freshness.mjs warns at 7 days and
# fails at 30, and a 48-hour cadence keeps every feed inside 2.
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          # The last night the throttle covers. The parity below puts a run ON
          # this date, so nightly resumes the next night with no gap in between.
          THROTTLE_THROUGH: '2026-10-07'
        run: |
          today=$(date -u +%F)

          # Days since the epoch, not day-of-month, so the alternation survives
          # month ends: 29 September is followed by 1 October, not by the 30th.
          parity=$(( $(date -u +%s) / 86400 % 2 ))

          if [ "${{ github.event_name }}" != 'schedule' ]; then
            reason='run by hand, never throttled'; run=true
          elif [[ "$today" > "$THROTTLE_THROUGH" ]]; then
            reason="past $THROTTLE_THROUGH, back to nightly"; run=true
          elif [ "$parity" -eq 1 ]; then
            reason='throttled to alternate nights, and tonight is one'; run=true
          else
            reason='throttled to alternate nights, and tonight is not one'; run=false
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "$today: $reason (sync=$run)" >> "$GITHUB_STEP_SUMMARY"

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write         # required to push the refreshed data back
    # Four crawls now — hotels, promotions, sailings and tours — and Virtuoso
    # drops instances into maintenance without warning, which slows everything
    # to a crawl until it passes. Generous rather than optimistic.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-concierge/package-lock.json

      - name: Install dependencies
        working-directory: next-concierge
        run: npm ci

      # Carry the crawl cache between runs.
      #
      # Every sync is resumable from NDJSON under scripts/cache/virtuoso, but a
      # runner starts empty, so without this the job re-fetches all ~8,800 detail
      # records nightly and a run that times out throws away everything it did.
      # That matters because this API is genuinely unreliable — Virtuoso drops
      # instances into maintenance for hours at a time, and during one of those
      # a single night cannot finish the crawl. With the cache restored, each
      # night continues where the last one stopped.
      #
      # The key rotates daily so the cache is rewritten rather than growing
      # stale; restore-keys falls back to the most recent previous day.
      - name: Restore the crawl cache
        uses: actions/cache@v4
        with:
          path: next-concierge/scripts/cache/virtuoso
          key: virtuoso-crawl-${{ github.run_id }}
          restore-keys: |
            virtuoso-crawl-

      # Each crawl is its own step, and none of them can fail the job.
      #
      # Chained with `&&` a bad night for sailings would throw away a perfectly
      # good hotel refresh that had already finished. They are independent
      # sources and are treated as such: whatever succeeded gets published,
      # whatever did not resumes tomorrow from the cache above.
      - name: Sync hotels
        id: hotels
        continue-on-error: true
        working-directory: next-concierge
        env: &virtuoso
          VIRTUOSO_API_USER: ${{ secrets.VIRTUOSO_API_USER }}
          VIRTUOSO_API_KEY: ${{ secrets.VIRTUOSO_API_KEY }}
          VIRTUOSO_API_AES_KEY: ${{ secrets.VIRTUOSO_API_AES_KEY }}
          VIRTUOSO_API_AES_IV: ${{ secrets.VIRTUOSO_API_AES_IV }}
        run: npm run sync:virtuoso-hotels

      - name: Sync promotions
        continue-on-error: true
        working-directory: next-concierge
        env: *virtuoso
        run: npm run sync:virtuoso-promotions

      # The journey atlases were reviewed against a complete crawl before this
      # was switched on, so the merge now runs here too.
      - name: Sync sailings
        continue-on-error: true
        working-directory: next-concierge
        env: *virtuoso
        run: npm run sync:virtuoso-cruises

      - name: Sync tours
        continue-on-error: true
        working-directory: next-concierge
        env: *virtuoso
        run: npm run sync:virtuoso-tours

      - name: Rebuild the atlases
        working-directory: next-concierge
        run: |
          npm run match:virtuoso-hotels
          npm run merge:virtuoso-hotels
          npm run merge:virtuoso-journeys
          npm run fix:ports
          npm run build:hotel-points
          npm run build:safari-camps
          npm run build:sea-routes
          npm run build:cruise-regions
          npm run build:journey-facts

      # The last gate before anything is committed, and the only one that sees
      # both what the supplier sent and what is already live. It covers all four
      # raw feeds and all six journey atlases, not just the hotel atlas — an
      # empty /v2/cruises response used to sail past it untouched.
      #
      # Note the trade-off it makes deliberately: one feed over its limit blocks
      # the WHOLE commit, including feeds that refreshed perfectly. That is the
      # opposite of the continue-on-error stance the crawls take above, and it is
      # the right way round — a crawl that fails publishes nothing new, while a
      # crawl that succeeds with half a catalogue publishes a deletion. Blocking
      # costs a day of freshness; not blocking costs live inventory.
      - name: Refuse an implausible shrink
        working-directory: next-concierge
        run: node scripts/verify-virtuoso-delta.mjs

      - name: Verify the atlas still holds together
        working-directory: next-concierge
        run: npm run verify:hotels

      # The published copy is now made of queries against the feed this job just
      # replaced, so a sync can break a sentence without touching a line of
      # code: retire a programme and "{{hotels:program=Rosewood Elite}}" starts
      # resolving to zero, in an indexed page whose whole value is being
      # quotable. verify:seo re-resolves every token and every evidence query
      # against the new data and refuses a run that would publish an empty
      # claim. It belongs here rather than only in `npm run verify`, because
      # this is the only path that changes the data with nobody watching.
      - name: Verify the answer copy still says something true
        working-directory: next-concierge
        run: npm run verify:seo

      # This step always commits, and that is deliberate.
      #
      # The heartbeat in virtuoso-sync-status.json moves every night by design:
      # it records that the sync RAN, which is the fact
      # verify-virtuoso-freshness.mjs judges the data on. Leave it uncommitted on
      # a quiet night and the last recorded check never advances, so a job that
      # is working perfectly reads as ageing after a week and stale after a
      # month. The old "No supplier changes today" branch could not fire anyway —
      # the heartbeat had already dirtied the tree by the time it was tested — so
      # what it really cost was an honest subject line.
      #
      # Both facts are kept instead: the data is committed either way, and the
      # subject says which kind of night it was.
      - name: Commit the refreshed data
        run: |
          DATA="next-concierge/data/atlas next-concierge/public/maps"
          HEARTBEAT="next-concierge/data/atlas/shared/virtuoso-sync-status.json"

          git config user.name  "virtuoso-sync[bot]"
          git config user.email "virtuoso-sync@users.noreply.github.com"
          git add -A -- $DATA

          if git diff --cached --quiet -- $DATA ":(exclude)$HEARTBEAT"; then
            SUBJECT="Virtuoso sync: no supplier changes"
          else
            SUBJECT="Refresh Virtuoso data"
          fi

          if git diff --cached --quiet -- $DATA; then
            echo "Nothing to commit — the sync produced no writes at all."
            exit 0
          fi

          # Read the run's own record of what it touched. The feeds carry no
          # per-run timestamp — that is what stopped every night looking like a
          # change — so the status file is the authority on what was checked and
          # what actually moved.
          SUMMARY=$(cd next-concierge && node -e "
            const s = require('./data/atlas/shared/virtuoso-sync-status.json');
            const lines = Object.entries(s.feeds ?? {}).map(([k, f]) =>
              \`\${k}: \${f.count ?? '?'} records, last changed \${(f.lastChanged ?? '').slice(0, 16)}\`);
            process.stdout.write(lines.join('\n') || 'No feed status recorded.');
          ")
          git commit -m "$SUBJECT" -m "Automated nightly sync from the Virtuoso Partner API." -m "$SUMMARY"
          git push
