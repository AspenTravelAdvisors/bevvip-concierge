# Runs the typecheck and the verification suite on every push to main and on
# every pull request.
#
# Before this, nothing checked a change people made. Vercel's build catches
# what fails to compile, and the nightly Virtuoso sync runs two verifiers over
# its own data commit, but the rest of `npm run verify` ran only when someone
# remembered to — and three of its checks were red on main with nobody told.
# The suite takes about a minute; there is no reason for it to be optional.
#
# What does NOT trigger this: the nightly sync pushes with GITHUB_TOKEN, and
# GitHub starts no workflow from that token's pushes. The sync carries its own
# gates (verify-virtuoso-delta, verify:hotels, verify:seo). This one covers
# code and hand-curated data.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR makes the older run moot. Every run on main is kept,
  # so each commit there has its own answer.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: next-concierge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-concierge/package-lock.json

      - name: Install dependencies
        run: npm ci

      # verify-all runs `check` (the typecheck) first, then every verifier, and
      # names all the failures at the end rather than stopping at the first.
      #
      # If a check ever goes red for a reason that needs a person rather than a
      # code change, give it its own `continue-on-error` step and pass
      # `--skip=<name>` here, rather than dropping it. Note that GitHub shows
      # such a step with a green tick even when it fails; only the run's
      # annotations say so.
      - name: Typecheck and verify
        run: node scripts/verify-all.mjs
